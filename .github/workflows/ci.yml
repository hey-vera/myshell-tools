name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (os=${{ matrix.os }}, node=${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dead-code check (knip)
        run: npm run knip

      - name: Unit and architecture tests
        run: npm test

      - name: UI tests
        run: npm run test:ui

      - name: Contract tests
        run: npm run test:contract

      - name: Build
        run: npm run build

      - name: Integration tests (real CLI, piped stdin)
        run: npm run test:integration

  coverage:
    name: Coverage (ubuntu-latest / node 22)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        # Native vitest coverage (v8). c8 cannot instrument vitest's worker
        # processes, so wrapping `npm test` in c8 reported near-zero coverage.
        # Provider, include, reporters, and thresholds live in vitest.config.ts.
        run: npx vitest run test/unit test/arch --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  package-check:
    # Branch protection requires this exact status-check context for the default cell.
    # Keep a single-entry matrix so smoke:packed can expand to more OS/node later without
    # renaming the required check; additional cells would need their own required contexts.
    name: Package check (ubuntu-latest / node 22)
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22]
        # Expand later, e.g.:
        # os: [ubuntu-latest, macos-latest, windows-latest]
        # node: [20, 22, 24]
        # Note: multi-cell matrix with a fixed name collapses check contexts — only expand
        # after branch protection is updated for the new naming scheme.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Dry-run pack and verify contents
        shell: bash
        run: |
          set -euo pipefail

          # Capture the list of files that would be packed
          pack_output=$(npm pack --dry-run 2>&1)
          echo "$pack_output"

          # Extract the file list section (lines after "Tarball Contents")
          file_list=$(echo "$pack_output" | awk '/Tarball Contents/,/Tarball Details/' | tail -n +2 | head -n -1)

          # Fail if any forbidden paths appear in the packed file list
          forbidden=(src/ test/ docs/ .github/)
          for pattern in "${forbidden[@]}"; do
            if echo "$file_list" | grep -q "$pattern"; then
              echo "ERROR: packed tarball contains forbidden path matching '$pattern'"
              echo "$file_list" | grep "$pattern"
              exit 1
            fi
          done

          echo "Package contents look clean — no src/, test/, docs/, or .github/ files included."

      - name: Real packed-artifact install smoke (R9.1)
        # Real `npm pack` tarball → install into empty temp project → both bins
        # --help/--version → actionable no-provider refusal → project integrity.
        # See scripts/packed-install-smoke.mjs and test/fixtures/support-matrix.json.
        # Primary CI proof lives here only — not in the multi-OS×Node test matrix.
        # MYSHELL_PACKED_SMOKE=1 documents opt-in for the vitest wrapper if used.
        env:
          MYSHELL_PACKED_SMOKE: '1'
        run: npm run smoke:packed
